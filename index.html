<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111821">
  <meta name="description" content="TensorScope NLP 原理实验室与 3D 射击训练的项目入口。">
  <title>NLP Report · 项目展示</title>
  <link rel="icon" href="data:,">
  <script>
    // 本地从 pages/ 打开时回到仓库根目录；部署首页时保持相对路径。
    if (/\/pages\/(?:index\.html)?$/.test(location.pathname)) {
      const base = document.createElement("base");
      base.href = "../";
      document.head.append(base);
    }
  </script>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #edf2f7; background: #111821; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 15% 0%, #17383d 0%, transparent 55%); }
    main { max-width: 1020px; margin: auto; padding: 88px 28px 40px; }
    .eyebrow { margin: 0 0 20px; color: #8cd8cf; font-size: 13px; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); font-weight: 700; letter-spacing: -.04em; }
    .intro { color: #aebdcb; line-height: 1.8; margin: 22px 0 44px; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .card { display: flex; flex-direction: column; padding: 32px; border: 1px solid #34434e; border-radius: 20px; text-decoration: none; color: inherit; background: #17232ed9; transition: border-color .18s, transform .18s; }
    .card:hover { border-color: var(--accent); transform: translateY(-4px); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .lab { --accent: #8cd8cf; }
    .game { --accent: #ffbe85; }
    .number { color: var(--accent); font-size: 13px; letter-spacing: .13em; }
    h2 { margin: 28px 0 10px; font-size: 28px; }
    .subtitle { color: var(--accent); margin: 0; font-size: 15px; }
    .description { color: #aebdcb; line-height: 1.85; margin: 22px 0 32px; }
    .enter { margin-top: auto; padding-top: 22px; border-top: 1px solid #34434e; color: var(--accent); font-weight: 600; display: flex; justify-content: space-between; }
    footer { margin-top: 40px; font-size: 13px; color: #8fa3b3; line-height: 1.8; }
    footer a { color: #aebdcb; text-underline-offset: 4px; }
    @media (max-width: 650px) { main { padding-top: 48px; } .projects { grid-template-columns: 1fr; } .card { padding: 26px; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">NLP REPORT / PROJECTS</p>
    <h1>从原理探索，到动手体验。</h1>
    <p class="intro">选择一个项目，开始你的探索。</p>
    <nav class="projects" aria-label="项目选择">
      <a class="card lab" href="./Project_gpt6.1/release/index.html">
        <span class="number">01 / LEARN</span>
        <h2>TensorScope</h2>
        <p class="subtitle">NLP 原理实验室</p>
        <p class="description">通过交互实验与可视化，探索词向量、序列模型和注意力机制，理解自然语言处理背后的计算过程。</p>
        <span class="enter">进入实验室 <span aria-hidden="true">↗</span></span>
      </a>
      <a class="card game" href="./game/index.html">
        <span class="number">02 / PLAY</span>
        <h2>Aim Trainer</h2>
        <p class="subtitle">3D 射击训练</p>
        <p class="description">在三维场景中练习瞄准与反应，调整训练参数，挑战自己的命中率和连击记录。推荐使用电脑和鼠标体验。</p>
        <span class="enter">开始训练 <span aria-hidden="true">↗</span></span>
      </a>
    </nav>
    <footer><a href="https://github.com/2024cnyuan/NLP-Report">在 GitHub 查看项目</a></footer>
  </main>
</body>
</html>
