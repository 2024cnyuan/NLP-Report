name: Deploy GPT6.1 Website

on:
  push:
    branches:
      - main
    paths:
      - "Project_gpt6.1/release/**"
      - "game/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p public

          # GPT 6.1 继续作为网站主页
          cp -r Project_gpt6.1/release/. public/

          # Game 放到 /game/ 下面
          mkdir -p public/game
          cp -r game/. public/game/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4